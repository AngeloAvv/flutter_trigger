name: Run Checks

on:
  workflow_call:

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Flutter
        uses: ./.github/actions/setup
      - name: Check formatting
        run: dart format --set-exit-if-changed $(git ls-files '*.dart' | grep -v '\.g\.dart$')

  codegen:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Flutter
        uses: ./.github/actions/setup
      - name: Regenerate ObjectBox bindings
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Fail on differences
        run: git diff --exit-code -- lib/

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Check docs.page sidebar and links
        run: bash .github/scripts/check_docs.sh
