name: Run Flutter Analyze

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Flutter
        uses: ./.github/actions/setup
      - name: Analyze
        run: flutter analyze
        working-directory: ${{ inputs.working-directory }}
